<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/fab-icon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#1c1915" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Fortress" />
    <meta name="description" content="Fortress Zimbabwe — live website and app. Same uploads on fortress-zw, PWA, and native apps." />
    <meta name="fortress-build" content="fortress-zw-live" />
    <link rel="canonical" href="https://fortress-zw.vercel.app/" />
    <title>Fortress</title>
    <style>
      html.tenant-pending body { visibility: hidden; }
    </style>
    <script>
      (function () {
        var host = String(location.hostname || '').toLowerCase()
        var slug = ''
        try {
          var params = new URLSearchParams(location.search || '')
          slug = String(params.get('subdomain') || params.get('site') || params.get('tenant') || '')
            .toLowerCase()
            .trim()
        } catch (e) {
          slug = ''
        }
        if (!slug) {
          if (host === 'prixburg.vercel.app' || host === 'prixburg-fortress.vercel.app') slug = 'prixburg'
          else if (host === 'rodcroft.vercel.app' || host === 'rodcroft-fortress.vercel.app') slug = 'rodcroft'
          else if (host.endsWith('.fortress.vercel.app')) {
            var sub = host.slice(0, -'.fortress.vercel.app'.length)
            if (sub && sub !== 'www' && sub.indexOf('.') === -1) slug = sub
          } else if (host.endsWith('.localhost')) {
            var localSub = host.slice(0, -'.localhost'.length)
            if (localSub && localSub.indexOf('.') === -1) slug = localSub
          }
        }
        if (!slug || slug === 'rodcroft' || location.pathname.indexOf('/prixburg-live') === 0) return
        if (slug === 'prixburg') {
          location.replace('/prixburg-live/index.html?tenant=prixburg')
          return
        }
        document.documentElement.classList.add('tenant-pending')
        window.__fortressHostSlug = slug
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script src="/fortress-vault.js"></script>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
