appId: com.fortress.app
productName: Fortress
copyright: Copyright © Fortress
directories:
  output: release
  buildResources: build
files:
  - dist/**/*
  - electron/**/*
  - package.json
asar: true
asarUnpack:
  - node_modules/sql.js/dist/**
extraMetadata:
  main: electron/main.cjs
win:
  target:
    - target: nsis
      arch:
        - x64
  artifactName: Fortress-Setup-${version}-${arch}.${ext}
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: Fortress
mac:
  target:
    - dmg
  category: public.app-category.business
linux:
  target:
    - AppImage
  category: Office
